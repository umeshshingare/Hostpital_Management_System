# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy backend only. Use external MySQL (Railway, Aiven, etc.) — see README.md
services:
  - type: web
    name: hospital-management-api
    runtime: java
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/hospital-management-api-1.0.0.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: https://*.vercel.app
