# Render Blueprint: https://render.com/docs/blueprint-spec
# Java is not in Render's native runtime list — use Docker (backend/Dockerfile).
services:
  - type: web
    name: hospital-management-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    # Allow time for Docker build + Flyway migrations on first deploy
    healthCheckInitialDelay: 180
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: https://*.vercel.app
